# Builds and publishes ghcr.io/kir-dev/schpincer, then opens/updates a PR on
# kir-dev/k8s bumping schpincer/versions.ts. Argo CD deploys that repo, so this
# workflow never touches the cluster. See kir-dev/k8s/schpincer/README.md.

name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/deploy.yml
      - .mvn/**
      - docker/Dockerfile
      - mvnw
      - pom.xml
      - src/main/**

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/schpincer
          tags: |
            # Renovate needs an increasing version to find the latest image
            # (a Git hash or just :latest@sha256:... doesn't work).
            type=raw,value=v0.0.${{ github.run_number }}
            type=raw,value=latest
            type=sha,format=long

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # docker/Dockerfile builds the jar too (and runs the tests).
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Renovate needs a Git tag to show a GitHub diff link in its PR.
      - name: Create Git tag
        run: |
          TAG_NAME="v0.0.${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

  update-k8s:
    name: Update kir-dev/k8s
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
    steps:
      # The Renovate config lives in kir-dev/k8s (schpincer/renovate.ts).
      - name: Checkout k8s
        uses: actions/checkout@v6
        with:
          repository: kir-dev/k8s
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2

      # bunx runs Renovate with Node; renovate@44 requires Node ^24.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: bun install --frozen-lockfile

      - run: bun run renovate schpincer
        env:
          RENOVATE_TOKEN: ${{ secrets.KIR_DEV_BOT_PAT }}
